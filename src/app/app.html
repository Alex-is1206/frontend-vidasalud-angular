<h1>VidaSalud</h1>

<p>Frontend Angular + Microsoft Entra ID</p>

@if (!initialized()) {

  <p>Inicializando autenticación...</p>

}

@if (initialized() && !loggedIn()) {

  <button (click)="login()">
    Iniciar sesión con Microsoft
  </button>

}

@if (initialized() && loggedIn()) {

  <p>Sesión iniciada correctamente ✅</p>

  <button routerLink="/secure">
    Ir a zona protegida
  </button>

  <button (click)="logout()">
    Cerrar sesión
  </button>

}

<hr>

<router-outlet></router-outlet>
