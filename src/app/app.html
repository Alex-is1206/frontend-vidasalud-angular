<header class="topbar">
  <a class="brand" routerLink="/">
    <span class="brand-cross">+</span> VidaSalud
  </a>

  @if (auth.autenticado()) {
    <nav>
      <a routerLink="/atenciones" routerLinkActive="active">Atenciones</a>
      <a routerLink="/prestaciones" routerLinkActive="active">Prestaciones</a>
      @if (auth.puedeVerBoxes()) {
        <a routerLink="/boxes" routerLinkActive="active">Boxes</a>
      }
      <a routerLink="/perfil" routerLinkActive="active">Mi perfil</a>
    </nav>

    <div class="user">
      <span class="user-name">{{ auth.nombre() }}</span>
      @for (rol of auth.roles(); track rol) {
        <span class="chip">{{ rol }}</span>
      }
      <button class="btn btn-small" (click)="auth.logout()">Cerrar sesión</button>
    </div>
  }
</header>

<main class="container">
  @if (!auth.inicializado()) {
    <p class="muted">Inicializando sesión...</p>
  } @else {
    <router-outlet />
  }
</main>
